  authModel: 'API-key style header credentials, defined per product in the specs: the Gateway Credit Card,
    HPP, and Token APIs use paired x-auth-account-id / x-auth-account-password headers; the Reports API
    uses x-auth-report-api-key / x-auth-report-api-password; Open Banking TPP API uses an HTTP bearer
    token plus an X-Client-ID apiKey header; Risk Monitor uses a bearer / X-AUTH-TOKEN header. No OAuth2
    flow objects are declared in the harvested specs, and no anonymous /.well-known/openid-configuration
    or oauth-authorization-server metadata is served (the portal''s /.well-known path returns the SPA
    shell, not OIDC metadata).'
  webhooks: Yes - webhooks/callbacks are pervasive. Harvested callback/webhook OpenAPI documents cover
    Gateway Credit Card callbacks, HPP webhooks, Reports callbacks, Credit Card Token webhooks, Risk Monitor
    webhooks, Open Banking Bank webhooks, and Open Banking Payment webhooks. The Issuer Transaction Authorization
    Interface (TAI API) is also a webhook-based interface.
  postman:
    available: false
    note: No public Postman collection or workspace was found.
  graphql:
    available: false
    note: No GraphQL surface documented; all documented APIs are REST/JSON.
  homeMarket: United Kingdom
  railsPosture: Tribe is a processor/BaaS layer rather than a scheme or clearing operator, so it publishes
    no ISO 20022 message catalog of its own. Its Open Banking APIs implement PSD2 account-information
    (AIS) and payment-initiation (PIS) patterns and, per Tribe's press, were built with Open Banking Europe;
    underlying UK rails are Faster Payments and Bacs operated by Pay.UK.
  transports:
  - protocol: REST
    scheme: https
    documented: true
    note: All 15 harvested specs are OpenAPI 3.0 REST/JSON. Documented server URLs are placeholders (http://127.0.0.1:10010/v3)
      or templated (%tpp_api_url%/tpp/v2); no real production base URL is published in the specs.
  - protocol: Webhooks
    scheme: https
    documented: true
    note: Callback/webhook interfaces documented as OpenAPI across most products.
