aid: tribe-payments
name: Tribe Payments
review:
  question: Does Tribe Payments expose a public developer portal with downloadable OpenAPI specifications?
  answer: true
  date: '2026-07-24'
  reviewer: API Evangelist
findings:
  summary: 'Tribe Payments runs a genuine, API-native developer portal at https://doc.tribepayments.com
    (HTTP 200, a Nuxt SPA backed by a public JSON API at /api/public/document-groups and /api/public/domain-configuration).
    The portal organizes nine product groups - Issuing Processor, Acquiring Processor, Gateway, Point
    of Sale, Risk Monitor, 3D Secure, Wallet, Open Banking, and Bank Connect. Fifteen verbatim OpenAPI
    3.0 documents were harvested from the portal''s public content endpoint (OPEN-API content tags) across
    eight products: the Gateway Credit Card, Hosted Payments (HPP), Credit Card Token, and Reports APIs;
    the POS Device Directory API; the Risk Monitor Client API; and the Open Banking Bank and TPP APIs,
    each with companion callback/webhook specs. Several core issuer-processor and acquiring APIs (Program
    Manager PM API, Transaction Authorization TAI API, Acquirer ACAPI, Merchant MAPI, Terminal TAPI, Tokenization
    TOKAPI) are documented in the portal but publish no downloadable OpenAPI in their current version
    (rendered as Markdown or changelog only). No public GitHub organization (github.com/tribepayments
    returns 404) or Postman collection was found. Sandbox access is request-gated via the contact form,
    not open self-service signup. Home market: United Kingdom (37 Lombard Street, London).'
