aid: tribe-payments
name: Tribe Payments
url: https://raw.githubusercontent.com/api-evangelist/tribe-payments/refs/heads/main/apis.yml
description: Tribe Payments is a London, United Kingdom-based payments technology company and issuer/acquirer
  processor that gives banks, acquirers, and fintechs a modular, API-driven platform to launch card and
  payment products without building core processing in-house. Built around its ISAAC processing engine,
  Tribe spans card issuing (issuer processing), merchant acquiring and a payment gateway, POS/SoftPOS
  terminal management, tokenization, fraud and risk monitoring, 3D Secure, digital wallets, Open Banking
  (PSD2 account-to-account payment initiation and account information), and Bank Connect / Banking-as-a-Service.
  Tribe positions itself as developer-led, publishing an extensive public API reference at doc.tribepayments.com;
  sandbox access is granted on request rather than through fully open self-service signup. Its home market
  is the United Kingdom, where PSD2/Open Banking and the Faster Payments and Bacs rails operated by Pay.UK
  anchor a dense cluster of API-native payment providers.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
