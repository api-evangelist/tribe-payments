spec_type: Webhooks
note: >-
  Tribe Payments does not publish an AsyncAPI document, but it ships an extensive
  documented webhook / asynchronous callback surface across every product family.
  The Gateway/Merchant APIs are asynchronous (202 Accepted) and deliver outcomes
  via registered callback addresses; Open Banking, Reports and Risk Monitor deliver
  event notifications via webhooks. Delivery model: HTTP POST to a client-registered
  URL. This catalog is derived verbatim from the callback/webhook OpenAPI files.
delivery:
  transport: http-post
  pattern: client-registered callback/notification URLs ("registered-*-address")
